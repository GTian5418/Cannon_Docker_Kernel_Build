# 更新：2026-01-07 by GTian5418 (assistant)
# 用途：构建 Cannon 内核（从公开仓库 gtcock/android_kernel_xiaomi_cannon 克隆全部分支）
on:
  workflow_dispatch:

name: Build Cannon Kernel God

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检出代码（工作流仓库，包含 build.sh）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装基础依赖（包含 gh CLI 和 ccache）
        run: |
          sudo apt update
          sudo apt install -y git wget curl tar zip unzip make binutils bison flex libssl-dev bc libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential python3 libncurses5-dev libncursesw5-dev pkg-config ccache gh

      - name: 创建 /cannon 工作目录
        run: |
          sudo mkdir -p /cannon
          sudo chown $USER:$USER /cannon

      - name: Checkout kernel repo (public) — 获取全部分支
        uses: actions/checkout@v4
        with:
          repository: 'gtcock/android_kernel_xiaomi_cannon'
          fetch-depth: 0
          path: kernel_tmp

      - name: Cache toolchains (clang / gcc64 / gcc32)
        uses: actions/cache@v4
        with:
          path: |
            /cannon/clang
            /cannon/gcc64
            /cannon/gcc32
          # 当 workflow 文件改变时刷新缓存
          key: toolchains-${{ runner.os }}-v1-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            toolchains-${{ runner.os }}-v1-

      - name: 移动 kernel 并条件性下载/解压工具链与 Anykernel
        run: |
          set -ex
          echo "STEP START: $(date)"
          rm -rf /cannon/kernel
          mkdir -p /cannon
          mv kernel_tmp /cannon/kernel

          # 小函数：通过 curl 下载，带重试/超时，失败时输出 header
          download() {
            url="$1"
            out="$2"
            echo "下载: $url -> $out"
            # 超时/重试设置：3 次重试，连接超时 30s，总超时 600s
            timeout 900 curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 -o "$out" "$url" || {
              echo "ERROR: 下载失败：$url"
              echo "打印 HTTP HEAD 以便诊断："
              curl -I "$url" || true
              return 1
            }
            echo "下载完成：$(ls -lh "$out" || true)"
          }

          # Clang（仅当 /cannon/clang 不存在时下载）
          if [ ! -d /cannon/clang ]; then
            echo "开始：下载并解压 clang..."
            mkdir -p /cannon/clang
            download "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/a71fa4c09d7109d611ee63964fc9fca58fee38cd/clang-r450784d.tar.gz" /cannon/clang.tar.gz
            echo "解压 clang ..."
            tar -zxf /cannon/clang.tar.gz -C /cannon/clang --strip-components=1
            rm -f /cannon/clang.tar.gz
            echo "clang 解压完成："
            du -sh /cannon/clang || true
          else
            echo "clang 已从缓存恢复，跳过下载。目录信息："
            ls -la /cannon/clang | sed -n '1,200p' || true
          fi

          # GCC64
          if [ ! -d /cannon/gcc64 ]; then
            echo "开始：下载并解压 gcc64..."
            mkdir -p /cannon/gcc64
            download "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" /cannon/gcc64.tar.gz
            echo "解压 gcc64 ..."
            tar -zxf /cannon/gcc64.tar.gz -C /cannon/gcc64 --strip-components=1
            rm -f /cannon/gcc64.tar.gz
            echo "gcc64 解压完成："
            du -sh /cannon/gcc64 || true
          else
            echo "gcc64 已从缓存恢复，跳过下载��目录信息："
            ls -la /cannon/gcc64 | sed -n '1,200p' || true
          fi

          # GCC32
          if [ ! -d /cannon/gcc32 ]; then
            echo "开始：下载并解压 gcc32..."
            mkdir -p /cannon/gcc32
            download "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" /cannon/gcc32.tar.gz
            echo "解压 gcc32 ..."
            tar -zxf /cannon/gcc32.tar.gz -C /cannon/gcc32 --strip-components=1
            rm -f /cannon/gcc32.tar.gz
            echo "gcc32 解压完成："
            du -sh /cannon/gcc32 || true
          else
            echo "gcc32 已从缓存恢复，跳过下载。目录信息："
            ls -la /cannon/gcc32 | sed -n '1,200p' || true
          fi

          # Anykernel3（仅当不存在时下载并解压）
          if [ ! -d /cannon/Anykernel3 ]; then
            echo "开始：下载并准备 AnyKernel3..."
            download "https://github.com/GTian5418/AnyKernel3/archive/refs/heads/cannon.zip" /cannon/Anykernel3.zip
            echo "解压 AnyKernel3 ..."
            unzip -o /cannon/Anykernel3.zip -d /cannon/anykernel_src
            mkdir -p /cannon/Anykernel3
            mv /cannon/anykernel_src/* /cannon/Anykernel3/ || true
            rm -rf /cannon/anykernel_src /cannon/Anykernel3.zip
            echo "Anykernel3 准备完成："
            ls -la /cannon/Anykernel3 | sed -n '1,200p' || true
          else
            echo "Anykernel3 已存在，跳过下载。目录信息："
            ls -la /cannon/Anykernel3 | sed -n '1,200p' || true
          fi

          echo "工具链与 AnyKernel 检查完成"
          echo "STEP END: $(date)"

      - name: 设置 ccache 缓存
        uses: actions/cache@v4
        with:
          path: /cannon/.ccache
          key: kernel-ccache-${{ github.sha }}
          restore-keys: kernel-ccache-

      - name: 复制 build.sh，执行编译脚本
        run: |
          set -ex
          echo "===== DEBUG: before running build.sh ====="
          echo "PATH = $PATH"
          echo "ls /cannon:"
          ls -la /cannon || true
          
          echo "ls /cannon/clang/bin:"
          ls -la /cannon/clang/bin || true
          
          echo "ls /cannon/gcc64/bin:"
          ls -la /cannon/gcc64/bin || true
          
          echo "ls /cannon/gcc32/bin:"
          ls -la /cannon/gcc32/bin || true
          
          echo "which ld.lld:"
          command -v ld.lld || echo "ld.lld not found in PATH"
          
          echo "which aarch64-linux-android-ld:"
          command -v aarch64-linux-android-ld || echo "aarch64-linux-android-ld not found in PATH"
          
          # 临时把工具链 bin 加到 PATH（确保没有多余空格）
          export PATH="/cannon/clang/bin:/cannon/gcc64/bin:/cannon/gcc32/bin:$PATH"
          echo "NEW PATH = $PATH"
          
          echo "再次检查工具:"
          command -v ld.lld || echo "ld.lld still missing"
          command -v aarch64-linux-android-ld || echo "aarch64-linux-android-ld still missing"
          ls -la /cannon/clang/bin | sed -n '1,200p' || true
          ls -la /cannon/gcc64/bin | sed -n '1,200p' || true
          
          # 如果需要，安装系统 lld 作为兜底（可选）
          # sudo apt-get update
          # sudo apt-get install -y lld || true
          
          # 最后执行 build.sh
          cp build.sh /cannon/build.sh
          chmod +x /cannon/build.sh
          cd /cannon
          ./build.sh

      - name: 检查构建产物是否存在
        run: |
          echo "列出 /cannon 目录内容："
          ls -la /cannon || true
          MISSING=0
          for f in Docker.zip Next.zip Su.zip; do
            if [ ! -f "/cannon/$f" ]; then
              echo "错误：/cannon/$f 不存在"
              MISSING=1
            else
              echo "发现产物：/cannon/$f"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "构建产物缺失，停止 workflow。"
            exit 1
          fi

      - name: 准备 KernelSU 管理器 APK
        run: |
          wget -q -O /cannon/KernelSU.apk "https://github.com/tiann/KernelSU/releases/download/v1.0.1/KernelSU_v1.0.1_11928-release.apk" || true
          wget -q -O /cannon/KernelSU-Next.apk "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v1.1.1/KernelSU_Next_v1.1.1-spoofed_12851-release.apk" || true

      - name: 生成 Release Tag
        id: tag
        run: |
          echo "tag=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: "Cannon-God 内核 - ${{ steps.tag.outputs.tag }}"
          body: "包含标准版、KernelSU版、KSU-Next版内核及对应的管理器 APK"
          draft: false
          prerelease: false

      - name: 附加 Docker.zip 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/Docker.zip
          asset_name: Anykernel3-Cannon-Docker-God.zip
          asset_content_type: application/zip

      - name: 附加 Next.zip 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/Next.zip
          asset_name: Anykernel3-Cannon-Docker-God-KernelSu-Next.zip
          asset_content_type: application/zip

      - name: 附加 Su.zip 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/Su.zip
          asset_name: Anykernel3-Cannon-Docker-God-KernelSu.zip
          asset_content_type: application/zip

      - name: 附加 KernelSU APK 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/KernelSU.apk
          asset_name: KernelSU.apk
          asset_content_type: application/vnd.android.package-archive

      - name: 附加 KernelSU-Next APK 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/KernelSU-Next.apk
          asset_name: KernelSU-Next.apk
          asset_content_type: application/vnd.android.package-archive

      - name: 上传构建产物为 workflow artifacts（以便手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: Anykernel3-Cannon-Docker-God
          path: /cannon/Docker.zip

      - name: 上传 KernelSU 产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: Anykernel3-Cannon-Docker-God-KernelSu
          path: /cannon/Su.zip

      - name: 上传 KernelSU-Next 产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: Anykernel3-Cannon-Docker-God-KernelSu-Next
          path: /cannon/Next.zip

      - name: 上传 APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-APKs
          path: |
            /cannon/KernelSU.apk
            /cannon/KernelSU-Next.apk
