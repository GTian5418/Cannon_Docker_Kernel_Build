on:
  workflow_dispatch:

name: Build Cannon Kernel God

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检出 workflow 仓库（包含 build.sh）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装基础依赖（包含 curl/ccache/lld）
        run: |
          sudo apt update
          sudo apt install -y git wget curl tar zip unzip make binutils bison flex libssl-dev bc libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential python3 libncurses5-dev libncursesw5-dev pkg-config ccache gh lld xz-utils

      - name: 创建 /cannon 工作目录
        run: |
          sudo mkdir -p /cannon
          sudo chown $USER:$USER /cannon
          mkdir -p /cannon/cache

      - name: Checkout kernel repo (public) — 获取全部分支
        uses: actions/checkout@v4
        with:
          repository: 'gtcock/android_kernel_xiaomi_cannon'
          fetch-depth: 0
          path: kernel_tmp

      - name: Cache toolchains tarball
        uses: actions/cache@v4
        with:
          path: /cannon/cache/toolchains.tar.gz
          key: toolchains-ubuntu-22.04-v1
          restore-keys: |
            toolchains-ubuntu-22.04-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /cannon/.ccache
          key: kernel-ccache-${{ github.sha }}
          restore-keys: kernel-ccache-

      - name: 移动 kernel 并恢复 / 下载 / 打包 toolchains（详细可见日志）
        run: |
          set -ex
          # 移动 kernel
          rm -rf /cannon/kernel
          mkdir -p /cannon
          mv kernel_tmp /cannon/kernel

          # 准备 helper 下载函数（curl + retry + timeout）
          download() {
            url="$1"
            out="$2"
            echo "Downloading $url -> $out"
            timeout 900 curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 -o "$out" "$url" || {
              echo "ERROR: download failed for $url"
              curl -I "$url" || true
              return 1
            }
            echo "Downloaded: $(ls -lh "$out" || true)"
          }

          # 若存在已缓存的 tarball，直接解压
          if [ -f /cannon/cache/toolchains.tar.gz ]; then
            echo "Found cached toolchains tarball, extracting..."
            tar -zxf /cannon/cache/toolchains.tar.gz -C /cannon
            echo "Extraction done."
          else
            echo "No cached tarball found — downloading toolchains..."

            # Clang
            download "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/a71fa4c09d7109d611ee63964fc9fca58fee38cd.tar.gz" /cannon/clang.tar.gz
            mkdir -p /cannon/clang
            tar -zxf /cannon/clang.tar.gz -C /cannon/clang --strip-components=1
            rm -f /cannon/clang.tar.gz

            # GCC64 (Android prebuilts)
            download "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" /cannon/gcc64.tar.gz
            mkdir -p /cannon/gcc64
            tar -zxf /cannon/gcc64.tar.gz -C /cannon/gcc64 --strip-components=1
            rm -f /cannon/gcc64.tar.gz

            # GCC32 (Android prebuilts)
            download "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" /cannon/gcc32.tar.gz
            mkdir -p /cannon/gcc32
            tar -zxf /cannon/gcc32.tar.gz -C /cannon/gcc32 --strip-components=1
            rm -f /cannon/gcc32.tar.gz

            # AnyKernel3 (仅当不存在)
            if [ ! -d /cannon/Anykernel3 ]; then
              download "https://github.com/GTian5418/AnyKernel3/archive/refs/heads/cannon.zip" /cannon/Anykernel3.zip
              unzip -q /cannon/Anykernel3.zip -d /cannon/anykernel_src
              mkdir -p /cannon/Anykernel3
              mv /cannon/anykernel_src/* /cannon/Anykernel3/ || true
              rm -rf /cannon/anykernel_src /cannon/Anykernel3.zip
            fi

            # 打包成单个 tar.gz 供 actions/cache 保存（下一次会被 restore）
            tar -zcf /cannon/cache/toolchains.tar.gz -C /cannon clang gcc64 gcc32 || true
            echo "Packed toolchains to /cannon/cache/toolchains.tar.gz"
          fi

          # 输出目录结构便于调试
          echo "Contents of /cannon after toolchain setup:"
          du -sh /cannon/* 2>/dev/null || true
          ls -la /cannon | sed -n '1,200p' || true

      - name: 修复交叉工具链的破损链接并确认工具可用
        run: |
          set -ex
          echo "Fixing toolchain symlinks and verifying tools..."

          for archdir in gcc64 gcc32; do
            ROOT_DIR="/cannon/${archdir}"
            BIN_DIR="${ROOT_DIR}/bin"
            echo "Processing $ROOT_DIR"
            if [ ! -d "$ROOT_DIR" ]; then
              echo "$ROOT_DIR not found, skip"
              continue
            fi
            mkdir -p "${BIN_DIR}"

            # 查找实际存在的 tool 文件并重建 bin 下的链接（如果目标不存在）
            for link in "${BIN_DIR}"/*; do
              [ -e "$link" ] || continue
              if [ -L "$link" ]; then
                target_abs=$(readlink -f "$link" || true)
                if [ -z "$target_abs" ] || [ ! -e "$target_abs" ]; then
                  name=$(basename "$link")
                  echo "Broken link: $link -> $(readlink "$link")"
                  # 在 ROOT_DIR 顶层寻找候选
                  found=$(find "$ROOT_DIR" -maxdepth 1 -type f -name "${name}*" | head -n 1 || true)
                  if [ -n "$found" ]; then
                    echo "Found real file: $found, relinking $link -> $found"
                    ln -sf "$found" "$link"
                  else
                    # 如果是 ld，尝试用 .gold 或 .bfd
                    if echo "$name" | grep -qE '(^|-)ld$'; then
                      for alt in "${ROOT_DIR}/${name}.gold" "${ROOT_DIR}/${name}.bfd"; do
                        if [ -f "$alt" ]; then
                          echo "Using alternative $alt for $name"
                          ln -sf "$alt" "$link"
                          found="$alt"
                          break
                        fi
                      done
                    fi
                    if [ -z "$found" ]; then
                      echo "No candidate found for $name in $ROOT_DIR"
                    fi
                  fi
                else
                  echo "Link ok: $link -> $target_abs"
                fi
              fi
            done

            # 确保存在无后缀的 ld（创建到 ld.gold 或 ld.bfd）
            for ldname in aarch64-linux-android-ld arm-linux-androideabi-ld; do
              if [ ! -x "${ROOT_DIR}/${ldname}" ]; then
                if [ -x "${ROOT_DIR}/${ldname}.gold" ]; then
                  ln -sf "${ROOT_DIR}/${ldname}.gold" "${ROOT_DIR}/${ldname}"
                  echo "Created ${ROOT_DIR}/${ldname} -> ${ROOT_DIR}/${ldname}.gold"
                elif [ -x "${ROOT_DIR}/${ldname}.bfd" ]; then
                  ln -sf "${ROOT_DIR}/${ldname}.bfd" "${ROOT_DIR}/${ldname}"
                  echo "Created ${ROOT_DIR}/${ldname} -> ${ROOT_DIR}/${ldname}.bfd"
                fi
              fi
            done

            echo "Final sample executables in $ROOT_DIR:"
            ls -la "$ROOT_DIR" | sed -n '1,200p' || true
            echo "Final $BIN_DIR contents:"
            ls -la "$BIN_DIR" | sed -n '1,200p' || true
          done

          # 确保系统 ld.lld 可用（我们在安装 deps 时已安装 lld）
          if command -v ld.lld >/dev/null 2>&1; then
            echo "ld.lld in PATH: $(command -v ld.lld)"
          else
            echo "Warning: ld.lld not found in PATH; ensure lld was installed."
          fi

          export PATH="/cannon/clang/bin:/cannon/gcc64/bin:/cannon/gcc32/bin:$PATH"
          echo "PATH=$PATH"
          aarch64-linux-android-ld --version || true
          arm-linux-androideabi-ld --version || true
          ld.lld --version || true

      - name: 复制 build.sh 并执行编译（带更多输出）
        run: |
          set -ex
          cp build.sh /cannon/build.sh
          chmod +x /cannon/build.sh
          # 确保 PATH 中包含 toolchains
          export PATH="/cannon/clang/bin:/cannon/gcc64/bin:/cannon/gcc32/bin:$PATH"
          echo "Running build.sh with PATH=$PATH"
          cd /cannon
          ./build.sh

      - name: 检查构建产物是否存在
        run: |
          echo "列出 /cannon 目录内容："
          ls -la /cannon || true
          MISSING=0
          for f in Docker.zip Next.zip Su.zip; do
            if [ ! -f "/cannon/$f" ]; then
              echo "错误：/cannon/$f 不存在"
              MISSING=1
            else
              echo "发现产物：/cannon/$f"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "构建产物缺失，停止 workflow。"
            exit 1
          fi

      - name: 准备 KernelSU 管理器 APK
        run: |
          wget -q -O /cannon/KernelSU.apk "https://github.com/tiann/KernelSU/releases/download/v1.0.1/KernelSU_v1.0.1_11928-release.apk" || true
          wget -q -O /cannon/KernelSU-Next.apk "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v1.1.1/KernelSU_Next_v1.1.1-spoofed_12851-release.apk" || true

      - name: 生成 Release Tag
        id: tag
        run: |
          echo "tag=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: "Cannon-God 内核 - ${{ steps.tag.outputs.tag }}"
          body: "包含标准版、KernelSU版、KSU-Next版内核及对应的管理器 APK"
          draft: false
          prerelease: false

      - name: 附加 Docker.zip 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/Docker.zip
          asset_name: Anykernel3-Cannon-Docker-God.zip
          asset_content_type: application/zip

      - name: 附加 Next.zip 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/Next.zip
          asset_name: Anykernel3-Cannon-Docker-God-KernelSu-Next.zip
          asset_content_type: application/zip

      - name: 附加 Su.zip 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/Su.zip
          asset_name: Anykernel3-Cannon-Docker-God-KernelSu.zip
          asset_content_type: application/zip

      - name: 附加 KernelSU APK 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/KernelSU.apk
          asset_name: KernelSU.apk
          asset_content_type: application/vnd.android.package-archive

      - name: 附加 KernelSU-Next APK 到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /cannon/KernelSU-Next.apk
          asset_name: KernelSU-Next.apk
          asset_content_type: application/vnd.android.package-archive

      - name: 上传构建产物为 workflow artifacts（以便手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: Anykernel3-Cannon-Docker-God
          path: /cannon/Docker.zip

      - name: 上传 KernelSU 产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: Anykernel3-Cannon-Docker-God-KernelSu
          path: /cannon/Su.zip

      - name: 上传 KernelSU-Next 产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: Anykernel3-Cannon-Docker-God-KernelSu-Next
          path: /cannon/Next.zip

      - name: 上传 APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-APKs
          path: |
            /cannon/KernelSU.apk
            /cannon/KernelSU-Next.apk
